[alembic]
script_location = migrations
# Fallback URL — overridden by DATABASE_URL from .env via migrations/env.py
# SQLite (portable, default - no Docker needed):
sqlalchemy.url = sqlite:///./sealink_attendance.db
# PostgreSQL (production) - uncomment below and comment the sqlite line:
# sqlalchemy.url = postgresql+psycopg://attendance:attendance@localhost:5432/attendance


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
